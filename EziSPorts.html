<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EziSPorts</title>
<style>
  :root { --bg:#fff; --surface:#f5f8ff; --text:#0f172a; --muted:#64748b; --blue:#2563eb; --blue-dark:#1d4ed8; --border:#e2e8f0; --danger:#dc2626; --ok:#16a34a;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .hidden { display:none !important; }
  input,select { font:inherit; }

  /* AUTH */
  #auth { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(135deg,#eff6ff 0%,#fff 60%); }
  .auth-card { width:100%; max-width:400px; background:#fff; border:1px solid var(--border); border-radius:20px; padding:32px; box-shadow:0 20px 50px rgba(37,99,235,.10); }
  .auth-logo { font-size:1.6rem; font-weight:800; color:var(--blue); text-align:center; }
  .auth-sub { text-align:center; color:var(--muted); margin:4px 0 24px; font-size:.95rem; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; background:var(--surface); border-radius:12px; padding:4px; margin-bottom:20px; }
  .tab { border:0; background:transparent; padding:10px; border-radius:9px; font-weight:600; color:var(--muted); cursor:pointer; }
  .tab.active { background:#fff; color:var(--blue); box-shadow:0 2px 8px rgba(0,0,0,.06); }
  label { display:block; font-size:.85rem; font-weight:600; margin:14px 0 6px; }
  input[type=text],input[type=email],input[type=password],input[type=search] { width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:12px; font-size:1rem; background:#fff; color:var(--text); outline:none; transition:border-color .2s,box-shadow .2s; }
  input:focus { border-color:var(--blue); box-shadow:0 0 0 4px rgba(37,99,235,.12); }
  .meter { height:6px; background:var(--border); border-radius:6px; margin-top:8px; overflow:hidden; }
  .meter div { height:100%; width:0; transition:width .3s,background .3s; }
  .hint { font-size:.8rem; color:var(--muted); margin-top:6px; }
  .btn { width:100%; margin-top:20px; padding:13px; border:0; border-radius:12px; background:var(--blue); color:#fff; font-size:1rem; font-weight:700; cursor:pointer; transition:background .2s,transform .1s; }
  .btn:hover { background:var(--blue-dark); } .btn:active { transform:scale(.99); }
  .msg { margin-top:14px; font-size:.9rem; text-align:center; min-height:1.2em; }
  .msg.err { color:var(--danger); } .msg.ok { color:var(--ok); }
  .secure { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:18px; font-size:.78rem; color:var(--muted); }

  /* APP */
  #app { display:flex; min-height:100vh; }
  aside { width:250px; flex-shrink:0; border-right:1px solid var(--border); padding:28px 18px; display:flex; flex-direction:column; gap:6px; }
  .logo { font-size:1.5rem; font-weight:800; margin:0 0 20px 8px; color:var(--blue); }
  nav { display:flex; flex-direction:column; gap:8px; }
  .nav-btn { display:flex; align-items:center; gap:12px; width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:12px 14px; border-radius:12px; font-size:.98rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .nav-btn .dot { width:8px; height:8px; border-radius:50%; background:var(--blue); opacity:.35; }
  .nav-btn:hover { border-color:var(--blue); color:var(--blue); }
  .nav-btn.active { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 6px 16px rgba(37,99,235,.25); }
  .nav-btn.active .dot { background:#fff; opacity:1; }
  .side-foot { margin-top:auto; border-top:1px solid var(--border); padding-top:16px; display:flex; flex-direction:column; gap:10px; }
  .lang { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:12px; background:#fff; color:var(--text); cursor:pointer; }
  .user-box { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .user-name { font-size:.9rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .logout { border:1px solid var(--border); background:#fff; border-radius:10px; padding:6px 10px; font-size:.85rem; cursor:pointer; color:var(--muted); }
  .logout:hover { color:var(--danger); border-color:var(--danger); }

  main { flex:1; padding:36px; min-width:0; }
  .section { display:none; } .section.active { display:block; }
  h1 { margin:0 0 20px; font-size:1.9rem; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; }
  .card h3 { margin:0 0 8px; font-size:1.05rem; }
  .card p { margin:0; color:var(--muted); line-height:1.55; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .icon { width:44px; height:44px; border-radius:12px; background:var(--blue); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .icon svg { width:24px; height:24px; stroke:#fff; fill:none; stroke-width:2; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:24px; }
  .stat { background:#fff; border:1px solid var(--border); border-radius:16px; padding:18px; }
  .stat b { display:block; font-size:1.6rem; color:var(--blue); }
  .stat span { font-size:.85rem; color:var(--muted); }
  .tag { display:inline-block; font-size:.75rem; font-weight:700; color:var(--blue); background:#dbeafe; padding:4px 10px; border-radius:999px; margin-bottom:10px; }
  .search { margin-bottom:16px; }
  .opt { display:block; width:100%; margin:8px 0; padding:13px 16px; border:1px solid var(--border); background:#fff; color:var(--text); border-radius:12px; cursor:pointer; text-align:left; font-size:1rem; font-weight:500; transition:all .2s; }
  .opt:hover:not(:disabled) { border-color:var(--blue); color:var(--blue); }
  .opt.right { border-color:var(--ok); background:#f0fdf4; color:var(--ok); }
  .opt.wrong { border-color:var(--danger); background:#fef2f2; color:var(--danger); }
  .result { font-weight:700; margin-top:12px; color:var(--blue); min-height:1.2em; }
  .btn-sm { margin-top:12px; padding:10px 18px; border:0; border-radius:10px; background:var(--blue); color:#fff; font-weight:600; cursor:pointer; }
  .progress { height:8px; background:var(--border); border-radius:8px; overflow:hidden; margin-bottom:14px; }
  .progress div { height:100%; background:var(--blue); transition:width .3s; }

  @media (max-width:700px) {
    #app { flex-direction:column; }
    aside { width:100%; padding:14px; border-right:0; border-bottom:1px solid var(--border); }
    .logo { margin:0 0 10px 4px; }
    nav { flex-direction:row; overflow-x:auto; }
    .nav-btn { width:auto; white-space:nowrap; }
    .side-foot { display:none; }
    main { padding:20px; }
  }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-card">
    <div class="auth-logo">EziSPorts</div>
    <p class="auth-sub" data-i18n="tagline"></p>
    <div class="tabs">
      <button class="tab active" data-tab="login" data-i18n="login"></button>
      <button class="tab" data-tab="register" data-i18n="register"></button>
    </div>

    <form id="login-form" novalidate>
      <label data-i18n="email"></label>
      <input id="l-email" type="email" autocomplete="email" required>
      <label data-i18n="password"></label>
      <input id="l-pass" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" data-i18n="login"></button>
      <div class="msg" id="l-msg"></div>
    </form>

    <form id="register-form" class="hidden" novalidate>
      <label data-i18n="name"></label>
      <input id="r-name" type="text" autocomplete="name" required>
      <label data-i18n="email"></label>
      <input id="r-email" type="email" autocomplete="email" required>
      <label data-i18n="password"></label>
      <input id="r-pass" type="password" autocomplete="new-password" required>
      <div class="meter"><div id="r-meter"></div></div>
      <div class="hint" data-i18n="pwdHint"></div>
      <label data-i18n="confirmPass"></label>
      <input id="r-pass2" type="password" autocomplete="new-password" required>
      <button class="btn" type="submit" data-i18n="register"></button>
      <div class="msg" id="r-msg"></div>
    </form>

    <div class="secure">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span data-i18n="secure"></span>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside>
    <div class="logo">EziSPorts</div>
    <nav>
      <button class="nav-btn active" data-target="home"><span class="dot"></span><span data-i18n="navHome"></span></button>
      <button class="nav-btn" data-target="topics"><span class="dot"></span><span data-i18n="navTopics"></span></button>
      <button class="nav-btn" data-target="news"><span class="dot"></span><span data-i18n="navNews"></span></button>
      <button class="nav-btn" data-target="quiz"><span class="dot"></span><span data-i18n="navQuiz"></span></button>
      <button class="nav-btn hidden" id="dev-nav" data-target="dev"><span class="dot"></span><span data-i18n="navDev"></span></button>
    </nav>
    <div class="side-foot">
      <select class="lang" id="lang-select" aria-label="Language">
        <option value="uz">O'zbek</option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
        <option value="kk">Қазақша</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
      </select>
      <div class="user-box">
        <span class="user-name" id="user-name"></span>
        <button class="logout" id="logout" data-i18n="logout"></button>
      </div>
    </div>
  </aside>

  <main>
    <section id="home" class="section active">
      <h1 data-i18n="homeTitle"></h1>
      <div class="stats">
        <div class="stat"><b>12</b><span data-i18n="statLeagues"></span></div>
        <div class="stat"><b>240+</b><span data-i18n="statTeams"></span></div>
        <div class="stat"><b>1 200</b><span data-i18n="statPlayers"></span></div>
      </div>
      <div class="grid" id="home-cards"></div>
    </section>

    <section id="topics" class="section">
      <h1 data-i18n="navTopics"></h1>
      <div class="grid" id="topic-cards"></div>
    </section>

    <section id="news" class="section">
      <h1 data-i18n="navNews"></h1>
      <input class="search" type="search" id="news-search" data-i18n-ph="searchPh">
      <div id="news-list"></div>
    </section>

    <section id="quiz" class="section">
      <h1 data-i18n="navQuiz"></h1>
      <div class="card">
        <div class="progress"><div id="q-bar"></div></div>
        <span class="tag" id="q-tag"></span>
        <h3 id="q-text"></h3>
        <div id="q-options"></div>
        <div class="result" id="q-result"></div>
        <button class="btn-sm hidden" id="q-next"></button>
      </div>
    </section>

    <section id="dev" class="section">
      <h1 data-i18n="devTitle"></h1>
      <div class="stats"><div class="stat"><b id="dev-count">0</b><span data-i18n="devUsers"></span></div></div>
      <div id="dev-users"></div>
    </section>
  </main>
</div>

};

let lang = 'uz';
try { lang = localStorage.getItem('ezi_lang') || 'uz'; } catch {}
if (!T[lang]) lang = 'uz';
const t = k => (T[lang][k] !== undefined ? T[lang][k] : T.en[k]);

/* ===== Security helpers ===== */
const enc = new TextEncoder();
const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const randHex = n => toHex(crypto.getRandomValues(new Uint8Array(n)));
async function hashPassword(password, saltHex) {
  const key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:enc.encode(saltHex), iterations:210000, hash:'SHA-256' }, key, 256);
  return toHex(bits);
}
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const sanitize = s => String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== Storage ===== */
let memUsers = {};
const store = {
  get() { try { return JSON.parse(localStorage.getItem('ezi_users') || '{}'); } catch { return memUsers; } },
  set(u) { memUsers = u; try { localStorage.setItem('ezi_users', JSON.stringify(u)); } catch {} },
  session() { try { return localStorage.getItem('ezi_session'); } catch { return null; } },
  setSession(e) { try { e ? localStorage.setItem('ezi_session', e) : localStorage.removeItem('ezi_session'); } catch {} }
};

/* ===== Brute-force protection ===== */
const attempts = {};
const locked = e => attempts[e] && attempts[e].until && Date.now() < attempts[e].until;
function failed(e) {
  const a = attempts[e] || { n:0 };
  if (++a.n >= 5) { a.until = Date.now() + 60000; a.n = 0; }
  attempts[e] = a;
}

/* ===== Language ===== */
const ICONS = [
  '<circle cx="12" cy="12" r="9"/><path d="M12 8l3 2.2-1.1 3.6h-3.8L9 10.2z"/>',
  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3.5 3.5 3.5 9.3 0 12.8M18.4 5.6c-3.5 3.5-3.5 9.3 0 12.8"/>',
  '<circle cx="12" cy="12" r="9"/><path d="M5 4.5c3 3 3 12 0 15M19 4.5c-3 3-3 12 0 15"/>'
];
function renderLists() {
  document.getElementById('home-cards').innerHTML = T[lang].home.map((h, i) =>
    `<div class="card"><div class="icon"><svg viewBox="0 0 24 24">${ICONS[i]}</svg></div><h3>${sanitize(h[0])}</h3><p>${sanitize(h[1])}</p></div>`).join('');
  document.getElementById('topic-cards').innerHTML = T[lang].topics.map(x =>
    `<div class="card"><span class="tag">${sanitize(x[2])}</span><h3>${sanitize(x[0])}</h3><p>${sanitize(x[1])}</p></div>`).join('');
  filterNews();
  renderDev();
}
function applyLang(l) {
  lang = T[l] ? l : 'uz';
  try { localStorage.setItem('ezi_lang', lang); } catch {}
  document.documentElement.lang = lang;
  document.getElementById('lang-select').value = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  renderLists();
  renderQ();
}
document.getElementById('lang-select').addEventListener('change', e => applyLang(e.target.value));

/* ===== News search ===== */
function filterNews() {
  const q = document.getElementById('news-search').value.trim().toLowerCase();
  document.getElementById('news-list').innerHTML = T[lang].news
    .filter(n => !q || (n[0] + n[1] + n[2]).toLowerCase().includes(q))
    .map(n => `<div class="card"><span class="tag">${sanitize(n[0])}</span><h3>${sanitize(n[1])}</h3><p>${sanitize(n[2])}</p></div>`).join('');
}
document.getElementById('news-search').addEventListener('input', filterNews);

/* ===== Auth UI ===== */
document.querySelectorAll('.tab').forEach(tb => tb.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === tb));
  document.getElementById('login-form').classList.toggle('hidden', tb.dataset.tab !== 'login');
  document.getElementById('register-form').classList.toggle('hidden', tb.dataset.tab !== 'register');
}));
const rPass = document.getElementById('r-pass');
rPass.addEventListener('input', () => {
  const p = rPass.value;
  const s = (p.length >= 8) + /[A-Z]/.test(p) + /[0-9]/.test(p) + /[^A-Za-z0-9]/.test(p);
  const m = document.getElementById('r-meter');
  m.style.width = (s / 4 * 100) + '%';
  m.style.background = ['#dc2626','#f59e0b','#eab308','#16a34a'][Math.max(0, s - 1)];
});
const showMsg = (id, key, ok) => { const el = document.getElementById(id); el.textContent = t(key); el.className = 'msg ' + (ok ? 'ok' : 'err'); };

document.getElementById('register-form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim().toLowerCase();
  const pass = rPass.value;
  if (name.length < 2) return showMsg('r-msg', 'eName');
  if (!emailOk(email)) return showMsg('r-msg', 'eEmail');
  if (pass.length < 8 || !/[A-Z]/.test(pass) || !/[0-9]/.test(pass) || !/[^A-Za-z0-9]/.test(pass)) return showMsg('r-msg', 'eWeak');
  if (pass !== document.getElementById('r-pass2').value) return showMsg('r-msg', 'eMatch');
  const users = store.get();
  if (users[email]) return showMsg('r-msg', 'eExists');
  const salt = randHex(16);
  users[email] = { name: sanitize(name), role: 'user', salt, hash: await hashPassword(pass, salt) };
  store.set(users);
  showMsg('r-msg', 'eOk', true);
  e.target.reset();
  document.getElementById('r-meter').style.width = '0';
});

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('l-email').value.trim().toLowerCase();
  const pass = document.getElementById('l-pass').value;
  if (locked(email)) return showMsg('l-msg', 'eLock');
  const users = store.get();
  if (!users.karimovdev) {
    const s = randHex(16);
    users.karimovdev = { name:'Karimov Dev', role:'developer', salt:s, hash: await hashPassword('karimov2424', s) };
    store.set(users);
  }
  const u = users[email];
  const hash = u ? await hashPassword(pass, u.salt) : await hashPassword(pass, randHex(16));
  if (!u || hash !== u.hash) { failed(email); return showMsg('l-msg', 'eWrong'); }
  delete attempts[email];
  store.setSession(email);
  enterApp(u);
  e.target.reset();
});

/* ===== App ===== */
function renderDev() {
  const users = Object.entries(store.get());
  document.getElementById('dev-count').textContent = users.length;
  document.getElementById('dev-users').innerHTML = users.map(([e, u]) =>
    `<div class="card"><h3>${sanitize(u.name)}</h3><p>${sanitize(e)} · ${u.role === 'developer' ? t('roleDev') : t('roleUser')}</p></div>`).join('');
}
function enterApp(u) {
  document.getElementById('user-name').textContent = u.name;
  document.getElementById('dev-nav').classList.toggle('hidden', u.role !== 'developer');
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderLists();
}
document.getElementById('logout').addEventListener('click', () => {
  store.setSession(null);
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth').classList.remove('hidden');
});
const navBtns = document.querySelectorAll('.nav-btn');
navBtns.forEach(b => b.addEventListener('click', () => {
  navBtns.forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === b.dataset.target));
}));

/* ===== Quiz ===== */
let qi = 0, score = 0, answered = false;
function renderQ() {
  const total = T[lang].quiz.length;
  const box = document.getElementById('q-options');
  const next = document.getElementById('q-next');
  document.getElementById('q-result').textContent = '';
  if (qi >= total) {
    document.getElementById('q-bar').style.width = '100%';
    document.getElementById('q-tag').textContent = t('finish');
    document.getElementById('q-text').textContent = t('scoreTxt') + ': ' + score + ' / ' + total;
    box.innerHTML = '';
    next.textContent = t('restart');
    next.classList.remove('hidden');
    return;
  }
  const q = T[lang].quiz[qi];
  document.getElementById('q-bar').style.width = (qi / total * 100) + '%';
  document.getElementById('q-tag').textContent = t('qLabel') + ' ' + (qi + 1) + ' / ' + total;
  document.getElementById('q-text').textContent = q[0];
  answered = false;
  next.classList.add('hidden');
  box.innerHTML = '';
  q[1].forEach((txt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = txt;
    b.onclick = () => {
      if (answered) return;
      answered = true;
      const ok = i === q[2];
      if (ok) score++;
      b.classList.add(ok ? 'right' : 'wrong');
      box.children[q[2]].classList.add('right');
      document.getElementById('q-result').textContent = ok ? t('correct') : t('wrong');
      next.textContent = t('next');
      next.classList.remove('hidden');
    };
    box.appendChild(b);
  });
}
document.getElementById('q-next').addEventListener('click', () => {
  if (qi >= T[lang].quiz.length) { qi = 0; score = 0; } else { qi++; }
  renderQ();
});

/* ===== Init ===== */
document.getElementById('lang-select').value = lang;
applyLang(lang);
(function () {
  const email = store.session();
  const u = email && store.get()[email];
  if (u) enterApp(u);
})();
</script>
